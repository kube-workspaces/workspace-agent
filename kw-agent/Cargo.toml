[package]
name = "kw-agent"
version = "0.1.0"
description = "Workspace agent service binary (platform backends P0-gated)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kw-agent"
path = "src/main.rs"

[dependencies]
kw-audio = { path = "../kw-audio" }
kw-core = { path = "../kw-core" }
kw-encode = { path = "../kw-encode" }
kw-management = { path = "../kw-management" }
kw-platform = { path = "../kw-platform" }
kw-protocol = { path = "../kw-protocol" }
kw-transport = { path = "../kw-transport" }
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"

[dev-dependencies]
ed25519-dalek = "=2.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-service = "0.7"
windows = { version = "0.52", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment",
    "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
