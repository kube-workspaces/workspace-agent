[package]
name = "kw-agent-updater"
version = "0.1.0"
description = "Independent Windows updater SCM lifetime and fail-closed journal recovery"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
kw-management = { path = "../kw-management" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows = { version = "0.52", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell",
    "Win32_System_Services",
] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "scm-test-host"
path = "examples/scm-test-host.rs"
