[package]
name = "kw-management"
version = "0.1.0"
description = "Independent management-v1 signed grant verification; no listener or runner"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
ed25519-dalek = "=2.1.1"
fs2 = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Registry",
    "Win32_System_Threading",
] }
