name: Lint

# fmt + clippy on every push/PR, separate from tests so a style break is
# obvious in the checks list. Both are workspace-wide with warnings denied.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
