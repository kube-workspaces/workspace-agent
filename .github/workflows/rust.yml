name: rust
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'kw-*/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'kw-*/**'
      - '.github/workflows/rust.yml'
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo run -p kw-agent --locked -- --version
      # Windows runners have real inbox APIs: --hello must emit valid JSON.
      - if: matrix.os == 'windows-latest'
        run: cargo run -p kw-agent --locked -- --hello > hello.json
      - if: matrix.os == 'windows-latest'
        run: python -c "import json; d=json.load(open('hello.json')); assert d['protocol']=='kw-agent-v1', d"
