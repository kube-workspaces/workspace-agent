name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate_fixtures.py
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
